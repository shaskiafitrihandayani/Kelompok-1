[agent]
  interval = "10s"
  flush_interval = "10s"

[[inputs.mqtt_consumer]]
  servers = ["tcp://localhost:1883"]
  topics = ["iot/kel1/dht22"]
  username = "esp32"
  password = "MQTT_PASSWORD"
  data_format = "json"
  name_override = "dht22"

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]
  token = "INFLUXDB_API_TOKEN"
  organization = "paramadina"
  bucket = "iot"
